name: Publish signed stable update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed release tag, including v prefix
        required: true
        type: string
      sequence:
        description: Monotonically increasing update sequence
        required: true
        type: number
      action:
        description: Install, force rollback to this tag, or pause updates
        required: true
        default: install
        type: choice
        options:
          - install
          - rollback
          - pause

permissions:
  contents: read

concurrency:
  group: lookout-stable-update-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-updates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Validate release request and signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATE_SEQUENCE: ${{ inputs.sequence }}
          UPDATE_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$UPDATE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          node -e 'const value=Number(process.argv[1]); if (!Number.isSafeInteger(value) || value < 1) process.exit(1)' "$UPDATE_SEQUENCE"
          if [[ "$UPDATE_ACTION" = pause ]]; then
            test "$(node -p "'v' + require('./package.json').version")" = "$RELEASE_TAG"
          else
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.object.type' <<<"$tag_object")" = tag
            tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
            test "v$(git show "$RELEASE_TAG:package.json" | jq -r .version)" = "$RELEASE_TAG"
          fi
      - name: Download immutable release artifacts
        if: inputs.action != 'pause'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --pattern "lookout-target-linux-amd64-$RELEASE_TAG.tar.gz" --pattern "lookout-target-linux-arm64-$RELEASE_TAG.tar.gz"
      - name: Create and sign stable manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATE_SEQUENCE: ${{ inputs.sequence }}
          UPDATE_ACTION: ${{ inputs.action }}
          LOOKOUT_UPDATE_SIGNING_KEY_ID: lookout-updates-2026-01
          LOOKOUT_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.LOOKOUT_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UPDATE_ACTION" = pause ]]; then
            jq -n --arg release "$RELEASE_TAG" --argjson sequence "$UPDATE_SEQUENCE" --arg publishedAt "$(date -u +%FT%TZ)" \
              '{schemaVersion:1,channel:"stable",sequence:$sequence,action:"pause",release:$release,publishedAt:$publishedAt}' > update-payload.json
          else
            for architecture in amd64 arm64; do
              file="dist/lookout-target-linux-$architecture-$RELEASE_TAG.tar.gz"
              test -f "$file"
              sha256sum "$file" | awk '{print $1}' > "$file.sha256"
            done
            jq -n --arg release "$RELEASE_TAG" --arg action "$UPDATE_ACTION" --argjson sequence "$UPDATE_SEQUENCE" --arg publishedAt "$(date -u +%FT%TZ)" \
              --arg amd64Url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/lookout-target-linux-amd64-$RELEASE_TAG.tar.gz" \
              --arg amd64Sha "$(cat "dist/lookout-target-linux-amd64-$RELEASE_TAG.tar.gz.sha256")" --argjson amd64Size "$(stat -c %s "dist/lookout-target-linux-amd64-$RELEASE_TAG.tar.gz")" \
              --arg arm64Url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/lookout-target-linux-arm64-$RELEASE_TAG.tar.gz" \
              --arg arm64Sha "$(cat "dist/lookout-target-linux-arm64-$RELEASE_TAG.tar.gz.sha256")" --argjson arm64Size "$(stat -c %s "dist/lookout-target-linux-arm64-$RELEASE_TAG.tar.gz")" \
              '{schemaVersion:1,channel:"stable",sequence:$sequence,action:$action,release:$release,publishedAt:$publishedAt,artifacts:{amd64:{url:$amd64Url,sha256:$amd64Sha,size:$amd64Size},arm64:{url:$arm64Url,sha256:$arm64Sha,size:$arm64Size}}}' > update-payload.json
          fi
          node scripts/sign-update-manifest.js update-payload.json signed-update-manifest.json
      - name: Publish stable channel to Supabase
        env:
          SUPABASE_URL: ${{ secrets.LOOKOUT_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.LOOKOUT_RELEASE_SUPABASE_SERVICE_KEY }}
          UPDATE_SEQUENCE: ${{ inputs.sequence }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_KEY"
          current="$(curl --fail --silent --show-error --max-time 15 \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/lookout_update_channels?channel=eq.stable&select=sequence&limit=1")"
          current_sequence="$(jq -r '.[0].sequence // 0' <<<"$current")"
          test "$UPDATE_SEQUENCE" -gt "$current_sequence"
          row="$(jq -n --argjson sequence "$UPDATE_SEQUENCE" --slurpfile manifest signed-update-manifest.json \
            '{channel:"stable",sequence:$sequence,manifest:$manifest[0],updated_at:(now|todateiso8601)}')"
          curl --fail --silent --show-error --max-time 15 -X POST \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H 'Content-Type: application/json' -H 'Prefer: resolution=merge-duplicates,return=minimal' \
            "$SUPABASE_URL/rest/v1/lookout_update_channels?on_conflict=channel" --data-binary "$row"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-update-${{ inputs.sequence }}
          path: signed-update-manifest.json
          if-no-files-found: error
