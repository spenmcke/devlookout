name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Require a GitHub-verified signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<<"$tag_object")" = tag
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:updates
      - name: Build immutable orchestration and Linux target artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./release/build-release.sh "$GITHUB_REF_NAME" dist
          for architecture in amd64 arm64; do
            container="lookout-node-$architecture-$GITHUB_RUN_ID"
            docker create --platform "linux/$architecture" --name "$container" node:24.19.0-bookworm-slim >/dev/null
            docker cp "$container:/usr/local/bin/node" "/tmp/node-$architecture"
            docker rm "$container" >/dev/null
            chmod 755 "/tmp/node-$architecture"
            LOOKOUT_TARGET_ARCH="$architecture" LOOKOUT_TARGET_NODE_BIN="/tmp/node-$architecture" ./release/build-release.sh "$GITHUB_REF_NAME" dist
          done
      - name: Render pinned hosted bootstrap
        shell: bash
        env:
          PUBLIC_RELEASE_BASE_URL: ${{ vars.LOOKOUT_PUBLIC_RELEASE_BASE_URL }}
        run: |
          test -n "$PUBLIC_RELEASE_BASE_URL"
          case "$PUBLIC_RELEASE_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          PUBLIC_RELEASE_BASE_URL="${PUBLIC_RELEASE_BASE_URL%/}"
          orchestration="dist/lookout-orchestration-$GITHUB_REF_NAME.tar.gz"
          orchestration_zip="dist/lookout-orchestration-$GITHUB_REF_NAME.zip"
          target_amd64="dist/lookout-target-linux-amd64-$GITHUB_REF_NAME.tar.gz"
          target_arm64="dist/lookout-target-linux-arm64-$GITHUB_REF_NAME.tar.gz"
          orchestration_digest="$(cat "$orchestration.sha256")"
          orchestration_zip_digest="$(cat "$orchestration_zip.sha256")"
          target_amd64_digest="$(cat "$target_amd64.sha256")"
          target_arm64_digest="$(cat "$target_arm64.sha256")"
          orchestration_url="$PUBLIC_RELEASE_BASE_URL/$GITHUB_REF_NAME/$(basename "$orchestration")"
          orchestration_zip_url="$PUBLIC_RELEASE_BASE_URL/$GITHUB_REF_NAME/$(basename "$orchestration_zip")"
          target_amd64_url="$PUBLIC_RELEASE_BASE_URL/$GITHUB_REF_NAME/$(basename "$target_amd64")"
          target_arm64_url="$PUBLIC_RELEASE_BASE_URL/$GITHUB_REF_NAME/$(basename "$target_arm64")"
          ./release/render-bootstrap.sh "$GITHUB_REF_NAME" "$orchestration_url" "$orchestration_digest" "$target_amd64_url" "$target_amd64_digest" dist/lookout-install.sh
          ./release/render-workstation-cli-bootstrap.sh "$GITHUB_REF_NAME" "$orchestration_url" "$orchestration_digest" "$orchestration_zip_url" "$orchestration_zip_digest" "$target_amd64_url" "$target_amd64_digest" "$target_arm64_url" "$target_arm64_digest" dist/lookout-cli-install.sh dist/lookout-cli-install.ps1
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/lookout-*.tar.gz
            dist/lookout-*.zip
            dist/lookout-install.sh
            dist/lookout-cli-install.sh
            dist/lookout-cli-install.ps1
      - name: Create release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Lookout $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: lookout-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
