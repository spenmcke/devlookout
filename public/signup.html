<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Start with Lookout</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="512x512" href="/lookout-logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/auth.css">
  </head>
  <body>
    <main class="auth-layout">
      <a class="auth-brand" href="/" aria-label="Lookout home">
        <span class="auth-brand-mark" aria-hidden="true"></span>
        <span>lookout</span>
      </a>

      <section class="auth-panel" aria-labelledby="authTitle">
        <div class="auth-card">
          <h1 id="authTitle">Start free</h1>
          <p class="auth-subtitle" id="authSubtitle">Sign in to view your dashboard. Security data stays on your infrastructure.</p>

          <div class="auth-error" id="authConfigError" role="alert" hidden></div>
          <button class="google-button" id="googleButton" type="button" aria-label="Continue with Google">
            <span class="google-button-content">
              <img class="google-logo" src="/google-g-official.png" alt="">
              <span data-button-label>Continue with Google</span>
            </span>
          </button>

          <div class="auth-divider"><span>or</span></div>

          <button class="email-toggle-button" id="emailToggleButton" type="button">Continue with Email</button>

          <form id="emailForm" hidden>
            <label class="sr-only" for="email">Email</label>
            <p class="field-note" id="emailInstructions">Enter your email and password to receive a verification code.</p>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="Email" aria-describedby="emailInstructions" required>

            <label class="sr-only" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Password, 8+ characters" required>

            <button class="submit-button" id="emailSubmit" type="submit">Send verification code</button>
          </form>

          <form id="otpForm" hidden>
            <label class="sr-only" for="otp">Verification code</label>
            <p class="field-note" id="otpInstructions">We sent a verification code to <strong id="otpEmail"></strong>. If you don't see the email, check your spam folder. Enter the code below.</p>
            <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" aria-describedby="otpInstructions" required>
            <button class="submit-button" id="otpSubmit" type="submit">Verify code</button>
            <button class="text-button" id="resendButton" type="button">Resend code</button>
          </form>

          <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="/auth/config.js" defer></script>
    <script src="/analytics.js" defer></script>
    <script src="/vendor/supabase.js" defer></script>
    <script src="/signup.js" defer></script>
  </body>
</html>
