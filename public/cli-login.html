<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Authorize Lookout CLI</title>
    <link rel="stylesheet" href="/auth.css">
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="cliTitle">
        <div class="auth-card">
          <h1 id="cliTitle">Authorize Lookout CLI</h1>
          <p class="auth-subtitle" id="cliMessage">Checking this installation request...</p>
          <div class="cli-command" id="cliLoginCommand" hidden>
            <pre><code>lookout login</code></pre>
            <button id="cliCopyCommand" type="button"><b id="cliCopyCommandLabel" aria-live="polite">Copy</b></button>
          </div>
          <pre id="cliScope" hidden></pre>
          <div id="cliVerificationFields">
            <label for="cliVerification">Verification code from the CLI</label>
            <input id="cliVerification" inputmode="numeric" pattern="[0-9]{8}" autocomplete="one-time-code" maxlength="8" required>
          </div>
          <button class="submit-button" id="cliApprove" type="button" hidden>Allow one installation</button>
          <p class="auth-message" id="cliStatus" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="/auth/config.js" defer></script>
    <script src="/vendor/supabase.js" defer></script>
    <script src="/auth-session.js" defer></script>
    <script src="/cli-login.js" defer></script>
  </body>
</html>
